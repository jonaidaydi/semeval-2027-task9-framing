[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semeval-2027-task9-framing"
version = "0.2.0"
description = "English paragraph framing baseline for SemEval 2027 Task 9"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "threadpoolctl==3.7.0",
  "narwhals==2.28.0",
  "cloudpickle==3.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]
